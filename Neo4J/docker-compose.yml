services:
  neo4j:
    image: ${NEO4J_DOCKER_IMAGE}
    container_name: neo4j
    user: "${USER_ID}:${GROUP_ID}"
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=${NEO4J_ACCEPT_LICENSE_AGREEMENT}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_pagecache_size=${NEO4J_server_memory_pagecache_size}
      - NEO4J_server_memory_heap_max__size=${NEO4J_server_memory_heap_max__size}
    volumes:
      - ${NEO4J_HOME_DATA:-./neo4j_storage}/data:/data
      - ${NEO4J_HOME_DATA:-./neo4j_storage}/logs:/logs
      - ${NEO4J_HOME_DATA:-./neo4j_storage}/import:/import
      - ${NEO4J_HOME_DATA:-./neo4j_storage}/plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1",
        ]
